<!DOCTYPE html>
<html lang="ko">

<head>
        <meta charset="UTF-8">
        <title>BOS LLM DEMO</title>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <style>
                /* ... (기존 body, container, chat, bubble, user, assistant, system-message, tps, copy-button, pre, code 스타일 유지) ... */
                body {
                        font-family: sans-serif;
                        background: #f0f2f5;
                        margin: 0;
                        padding: 0;
                        display: flex;
                        justify-content: center;
                        align-items: flex-start;
                        min-height: 100vh;
                }

                .container {
                        max-width: 800px;
                        width: 90%;
                        margin-top: 40px;
                        margin-bottom: 40px;
                        background: white;
                        padding: 20px;
                        border-radius: 8px;
                        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
                        display: flex;
                        flex-direction: column;
                }

                #chat {
                        display: flex;
                        flex-direction: column;
                        gap: 15px;
                        max-height: 500px;
                        overflow-y: auto;
                        padding-bottom: 10px;
                        margin-bottom: 15px;
                        flex-grow: 1;
                }

                .bubble {
                        padding: 12px 16px;
                        border-radius: 18px;
                        max-width: 100%;
                        /* 버블 너비가 부모를 넘지 않도록 */
                        white-space: pre-wrap;
                        line-height: 1.5;
                        position: relative;
                        /* copy-button의 기준점 */
                        overflow-wrap: break-word;
                        /* 긴 단어 자동 줄바꿈 */
                }

                .user {
                        align-self: flex-end;
                        background: #10a37f;
                        color: white;
                        border-bottom-right-radius: 4px;
                }

                .assistant {
                        align-self: flex-start;
                        background: #e5e5ea;
                        color: black;
                        border-bottom-left-radius: 4px;
                        position: relative;
                        /* TTS 아이콘 등의 기준점 */
                }

                .assistant pre {
                        /* assistant 내부의 pre 태그에만 적용 */
                        max-width: 100%;
                        /* assistant bubble 내부에서 pre의 최대 너비 */
                        overflow-x: auto;
                }


                .system-message {
                        /* 채팅창 내 시스템 메시지 스타일 */
                        align-self: center;
                        background: #f8f9fa;
                        color: #495057;
                        border: 1px solid #dee2e6;
                        padding: 8px 12px;
                        border-radius: 10px;
                        font-size: 0.85em;
                        text-align: center;
                        max-width: 80%;
                        margin-top: 5px;
                        margin-bottom: 5px;
                }

                .system-message.error {
                        color: #dc3545;
                        border-color: #f5c6cb;
                        background-color: #f8d7da;
                }


                .tps {
                        font-size: 0.8em;
                        color: #666;
                        margin-top: 8px;
                        /* 콘텐츠와 약간의 간격 */
                }

                .copy-button {
                        position: absolute;
                        top: 8px;
                        right: 10px;
                        background: transparent;
                        border: none;
                        font-size: 0.9em;
                        color: #666;
                        cursor: pointer;
                        padding: 3px;
                        z-index: 1;
                }

                .copy-button:hover {
                        color: #333;
                }

                /* .tts-speaker-icon 및 관련 스타일 삭제 */

                pre {
                        background: #333;
                        color: #eee;
                        padding: 10px;
                        border-radius: 6px;
                        overflow-x: auto;
                        /* 내부 코드 블록이 길 경우 가로 스크롤 */
                        max-width: 100%;
                        /* pre 태그 자체가 버블을 넘지 않도록 */
                        box-sizing: border-box;
                        /* 패딩 포함하여 너비 계산 */
                }

                code {
                        /* 인라인 코드 블록 */
                        background: #eee;
                        padding: 2px 4px;
                        border-radius: 4px;
                        font-family: monospace;
                }

                pre code {
                        /* pre 내부의 code는 스타일 초기화 */
                        background: none;
                        padding: 0;
                }

                .controls-area {
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                }

                textarea#prompt {
                        width: 100%;
                        box-sizing: border-box;
                        height: 80px;
                        font-size: 1em;
                        padding: 10px;
                        border: 1px solid #ccc;
                        border-radius: 6px;
                        resize: vertical;
                }

                .action-buttons-row {
                        display: flex;
                        gap: 10px;
                        justify-content: center;
                        /* 버튼 중앙 정렬 */
                        align-items: stretch;
                        /* 버튼 높이 동일하게 */
                }

                .action-buttons-row button {
                        padding: 10px 15px;
                        font-size: 0.9em;
                        color: white;
                        border: none;
                        border-radius: 6px;
                        cursor: pointer;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 5px;
                        /* 아이콘과 텍스트 사이 간격 */
                        flex-grow: 1;
                        /* 버튼들이 공간을 균등하게 차지 */
                        flex-basis: 0;
                        /* flex-grow를 위해 기본 너비 0으로 */
                }

                button.send {
                        background: #28a745;
                }

                button#recordBtn {
                        background-color: #17a2b8;
                }

                button#recordBtn.recording {
                        background-color: #dc3545;
                        /* 녹음 중일 때 빨간색 */
                }

                button.reset {
                        background: #dc3545;
                }

                #recordStatus {
                        /* 하단 로그 표시 영역 */
                        display: none;
                        /* 기본적으로 숨김 */
                        text-align: center;
                        font-size: 0.9em;
                        color: #555;
                        margin-top: 5px;
                        padding: 5px 8px;
                        background-color: #f0f0f0;
                        border-radius: 4px;
                        border: 1px solid #ddd;
                }

                #recordStatus.error {
                        color: #D8000C;
                        background-color: #FFD2D2;
                        border-color: #D8000C;
                }

                #recordStatus.success {
                        color: #270;
                        background-color: #DFF2BF;
                        border-color: #4F8A10;
                }

                #recordStatus.info {
                        color: #00529B;
                        background-color: #BDE5F8;
                        border-color: #00529B;
                }
        </style>
</head>

<body>
        <div class="container">
                <h2>💬 BOS LLM DEMO</h2>
                <div id="chat"></div>

                <div class="controls-area">
                        <textarea id="prompt" placeholder="메시지를 입력하세요... (Enter: 전송, Shift+Enter: 줄바꿈)"></textarea>
                        <div class="action-buttons-row">
                                <button class="send" id="sendBtn">보내기</button>
                                <button id="recordBtn">🎤 녹음 시작</button>
                                <button class="reset" id="resetBtn">초기화</button>
                        </div>
                        <span id="recordStatus"></span>
                </div>
        </div>

        <script>
                const promptBox = document.getElementById("prompt");
                const chatBox = document.getElementById("chat");
                const sendBtn = document.getElementById("sendBtn");
                const resetBtn = document.getElementById("resetBtn");
                let abortController = null;

                const recordBtn = document.getElementById('recordBtn');
                const recordStatus = document.getElementById('recordStatus');
                let mediaRecorder;
                let audioChunks = [];
                let isRecording = false;
                let sttStatusIntervalId = null;
                // ttsStatusIntervalId 삭제
                let recordStatusTimeoutId = null;
                // activeTTSPlayers 삭제

                function updateRecordStatus(message, type = 'info', persist = false) {
                        if (recordStatusTimeoutId) {
                                clearTimeout(recordStatusTimeoutId);
                        }
                        recordStatus.textContent = message;
                        recordStatus.className = type;
                        recordStatus.style.display = 'block';

                        if (!persist) {
                                recordStatusTimeoutId = setTimeout(() => {
                                        recordStatus.style.display = 'none';
                                        recordStatus.textContent = '';
                                        recordStatus.className = '';
                                }, 5000);
                        }
                }


                promptBox.addEventListener("keydown", function (e) {
                        if (e.key === "Enter" && !e.shiftKey) {
                                e.preventDefault();
                                sendChat();
                        }
                });

                sendBtn.addEventListener("click", () => {
                        sendChat();
                });

                resetBtn.addEventListener("click", () => {
                        if (abortController) abortController.abort();
                        chatBox.innerHTML = "";
                        promptBox.value = "";
                        if (isRecording) {
                                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                                        mediaRecorder.stop();
                                }
                                isRecording = false;
                                recordBtn.innerHTML = '🎤 녹음 시작';
                                recordBtn.classList.remove('recording');
                                console.log('녹음 취소됨.');
                                audioChunks = [];
                        }

                        // activeTTSPlayers 관련 로직 삭제

                        if (sttStatusIntervalId) {
                                clearInterval(sttStatusIntervalId);
                                sttStatusIntervalId = null;
                        }
                        // ttsStatusIntervalId 관련 로직 삭제
                        if (recordStatusTimeoutId) {
                                clearTimeout(recordStatusTimeoutId);
                        }
                        recordStatus.textContent = '';
                        recordStatus.style.display = 'none';
                        recordStatus.className = '';
                });

                function appendSystemMessage(message, isError = false) {
                        const systemBubble = document.createElement("div");
                        systemBubble.className = "bubble system-message";
                        if (isError) {
                                systemBubble.classList.add("error");
                        }
                        systemBubble.textContent = message;
                        chatBox.appendChild(systemBubble);
                        chatBox.scrollTop = chatBox.scrollHeight;
                        setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 100); // Ensure scroll after render
                }

                // updateSpeakerState 함수 삭제
                // playTTSSound 함수 삭제

                recordBtn.addEventListener('click', async () => {
                        if (!isRecording) {
                                // --- 녹음 시작 시, 모든 활성 TTS 오디오 중지 로직 삭제 ---
                                // let audioWasPlaying = false;
                                // activeTTSPlayers.forEach(...);
                                // if (audioWasPlaying) { ... }
                                // --- 오디오 중지 로직 끝 ---

                                try {
                                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                                        const options = {};
                                        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                                                options.mimeType = 'audio/webm;codecs=opus';
                                        } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                                                options.mimeType = 'audio/webm';
                                        } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
                                                options.mimeType = 'audio/ogg;codecs=opus';
                                        } else {
                                                console.warn("선호하는 webm/opus MIME 타입이 지원되지 않습니다. 브라우저 기본값을 사용합니다.");
                                        }

                                        mediaRecorder = new MediaRecorder(stream, options);
                                        audioChunks = [];

                                        mediaRecorder.ondataavailable = event => {
                                                audioChunks.push(event.data);
                                        };

                                        mediaRecorder.onstop = async () => {
                                                const currentStreamTracks = mediaRecorder.stream.getTracks(); // Get tracks before clearing audioChunks
                                                if (sttStatusIntervalId) { // Clear any existing STT timer
                                                        clearInterval(sttStatusIntervalId);
                                                        sttStatusIntervalId = null;
                                                }

                                                if (audioChunks.length === 0) {
                                                        console.log('No audio data recorded or recording was reset.');
                                                        updateRecordStatus('녹음된 데이터가 없거나 취소되었습니다.', 'error');
                                                        currentStreamTracks.forEach(track => track.stop()); // Stop tracks if no data
                                                        if (isRecording) { // Check if it was recording (e.g. stopped by reset)
                                                                isRecording = false;
                                                                recordBtn.innerHTML = '🎤 녹음 시작';
                                                                recordBtn.classList.remove('recording');
                                                        }
                                                        return;
                                                }

                                                const blobMimeType = mediaRecorder.mimeType || (options.mimeType || 'audio/webm'); // Fallback
                                                const audioBlob = new Blob(audioChunks, { type: blobMimeType });
                                                audioChunks = []; // Clear chunks after creating blob
                                                const formData = new FormData();
                                                let recordingFilename = 'recording';
                                                if (blobMimeType.includes('webm')) recordingFilename += '.webm';
                                                else if (blobMimeType.includes('ogg')) recordingFilename += '.ogg';
                                                else recordingFilename += '.bin'; // Generic binary extension

                                                formData.append('audio_data', audioBlob, recordingFilename);

                                                let startTime = Date.now();
                                                updateRecordStatus('오디오 업로드 및 STT 변환 중... (0초)', 'info', true);
                                                console.log('오디오 업로드 및 STT 변환 시작...');

                                                sttStatusIntervalId = setInterval(() => {
                                                        const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                                                        // Check if the status message is still the STT one
                                                        if (recordStatus.style.display === 'block' && recordStatus.textContent.startsWith("오디오 업로드 및 STT 변환 중")) {
                                                                recordStatus.textContent = `오디오 업로드 및 STT 변환 중... (${elapsedTime}초)`;
                                                        } else { // If message changed (e.g. error, success), clear interval
                                                                clearInterval(sttStatusIntervalId);
                                                                sttStatusIntervalId = null;
                                                        }
                                                }, 1000);

                                                try {
                                                        const response = await fetch('/upload_audio', {
                                                                method: 'POST',
                                                                body: formData
                                                        });
                                                        clearInterval(sttStatusIntervalId); // Clear interval on response
                                                        sttStatusIntervalId = null;
                                                        const result = await response.json();

                                                        if (response.ok && result.file_saved) {
                                                                console.log(`서버 메시지 (upload_audio): ${result.message}`);
                                                                if (result.transcribed_text && result.transcribed_text.trim() !== "") {
                                                                        console.log(`STT 변환 결과: ${result.transcribed_text}`);
                                                                        updateRecordStatus(`음성인식 결과: ${result.transcribed_text}`, 'success');
                                                                        sendChat(result.transcribed_text, true); // Send STT result to chat
                                                                } else {
                                                                        const customMessage = "음성인식에 실패했거나 음성이 감지되지 않았습니다.";
                                                                        console.warn(customMessage + ` (서버 상세: ${result.message || 'STT 결과 없음'})`);
                                                                        updateRecordStatus(customMessage, 'error');
                                                                }
                                                        } else {
                                                                const errorMsg = `오디오 업로드/변환 오류: ${result.error || response.statusText || '알 수 없는 오류'}`;
                                                                console.error(errorMsg);
                                                                updateRecordStatus(errorMsg, 'error');
                                                        }
                                                } catch (error) {
                                                        if (sttStatusIntervalId) { // Ensure interval is cleared on error
                                                                clearInterval(sttStatusIntervalId);
                                                                sttStatusIntervalId = null;
                                                        }
                                                        console.error('오디오 업로드 처리 중 알 수 없는 오류 발생:', error);
                                                        const errorMsg = '오디오 업로드 처리 중 알 수 없는 오류가 발생했습니다.';
                                                        updateRecordStatus(errorMsg, 'error');
                                                } finally {
                                                        if (sttStatusIntervalId) { // Final check for interval
                                                                clearInterval(sttStatusIntervalId);
                                                                sttStatusIntervalId = null;
                                                        }
                                                        currentStreamTracks.forEach(track => track.stop()); // Always stop tracks after processing
                                                }
                                        };

                                        mediaRecorder.start();
                                        isRecording = true;
                                        recordBtn.innerHTML = '■ 녹음 중지';
                                        recordBtn.classList.add('recording');
                                        updateRecordStatus('녹음 시작됨...', 'info');
                                        console.log('녹음 시작됨...');

                                } catch (err) {
                                        console.error('녹음 시작 오류:', err);
                                        let userFriendlyMessage = '마이크 접근 중 오류가 발생했습니다.';
                                        if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
                                                userFriendlyMessage = '마이크 권한이 거부되었습니다. 브라우저 설정을 확인해주세요.';
                                        } else if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
                                                userFriendlyMessage = '사용 가능한 마이크가 없습니다.';
                                        } else if (err.name === "NotReadableError" || err.name === "TrackStartError") {
                                                userFriendlyMessage = '마이크를 사용할 수 없습니다. 다른 앱에서 사용 중인지 확인해주세요.';
                                        }
                                        updateRecordStatus(userFriendlyMessage, 'error');
                                }
                        } else { // Stop recording
                                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                                        mediaRecorder.stop(); // This will trigger mediaRecorder.onstop
                                }
                                isRecording = false;
                                recordBtn.innerHTML = '🎤 녹음 시작';
                                recordBtn.classList.remove('recording');
                                updateRecordStatus('녹음 중지됨.', 'info');
                                console.log('녹음 중지 요청됨.');
                        }
                });

                function sendChat(inputText, isFromSTT = false) {
                        const promptFromBox = promptBox.value.trim();
                        const finalPrompt = isFromSTT ? inputText : promptFromBox;

                        if (!finalPrompt) return;

                        if (abortController) {
                                abortController.abort();
                                console.log("Previous fetch aborted");
                        }
                        abortController = new AbortController();

                        if (!isFromSTT) {
                                promptBox.value = "";
                        }

                        const userBubble = document.createElement("div");
                        userBubble.className = "bubble user";
                        userBubble.textContent = isFromSTT ? "🎤: " + finalPrompt : finalPrompt;
                        chatBox.appendChild(userBubble);
                        chatBox.scrollTop = chatBox.scrollHeight;


                        const assistantBubble = document.createElement("div");
                        assistantBubble.className = "bubble assistant";
                        assistantBubble.innerHTML = "⏳ 생각 중...";
                        chatBox.appendChild(assistantBubble);
                        chatBox.scrollTop = chatBox.scrollHeight;


                        const copyBtn = document.createElement("button");
                        copyBtn.className = "copy-button";
                        copyBtn.innerText = "📋";
                        copyBtn.title = "복사";
                        copyBtn.style.display = 'none'; // Initially hidden

                        copyBtn.onclick = (e) => {
                                e.stopPropagation(); // Prevent bubble click if any
                                const tempDiv = document.createElement("div");
                                let textToCopy = assistantBubble.dataset.rawFullText || ""; // Use raw full text for copy
                                tempDiv.innerHTML = marked.parse(textToCopy); // Parse markdown to HTML
                                const pureText = tempDiv.textContent || tempDiv.innerText || ""; // Extract text content

                                navigator.clipboard.writeText(pureText).then(() => {
                                        copyBtn.innerText = "✅";
                                        setTimeout(() => copyBtn.innerText = "📋", 1500);
                                }).catch(err => {
                                        console.error('클립보드 복사 실패:', err);
                                        copyBtn.innerText = "❌";
                                        setTimeout(() => copyBtn.innerText = "📋", 1500);
                                });
                        };

                        let assistantRawAccumulated = ""; // For display and copy
                        // assistantRawForTTS 삭제
                        let tpsText = "";
                        let firstChunkReceived = false;

                        fetch("/chat", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ prompt: finalPrompt }),
                                signal: abortController.signal
                        })
                                .then(res => {
                                        if (!res.ok) {
                                                return res.text().then(text => { // Attempt to get error message from body
                                                        throw new Error(`서버 오류: ${res.status} ${res.statusText} - ${text}`);
                                                });
                                        }
                                        const reader = res.body.getReader();
                                        const decoder = new TextDecoder("utf-8");
                                        let buffer = "";

                                        function read() {
                                                reader.read().then(({ done, value }) => {
                                                        if (abortController.signal.aborted) {
                                                                console.log("Fetch aborted during read");
                                                                if (!firstChunkReceived && assistantBubble.innerHTML.includes("⏳")) {
                                                                        assistantBubble.innerHTML = "<span style='color:orange;'>요청이 중단되었습니다.</span>";
                                                                        copyBtn.style.display = 'none';
                                                                }
                                                                return;
                                                        }

                                                        const chunk = value ? decoder.decode(value, { stream: true }) : "";
                                                        buffer += chunk;

                                                        let currentTextChunkOnly = ""; // Text part of the current chunk processing iteration
                                                        let tpsFoundInChunk = false;

                                                        let lastProcessedIndex = 0;
                                                        while (true) {
                                                                const tpsOpenIndex = buffer.indexOf("<tps>", lastProcessedIndex);
                                                                if (tpsOpenIndex === -1) { // No more <tps> tags in the remaining buffer
                                                                        const textPart = buffer.substring(lastProcessedIndex);
                                                                        currentTextChunkOnly += textPart;
                                                                        assistantRawAccumulated += textPart;
                                                                        // assistantRawForTTS += textPart; // 삭제
                                                                        buffer = ""; // All processed
                                                                        break;
                                                                }

                                                                // Text before the <tps> tag
                                                                const textBeforeTps = buffer.substring(lastProcessedIndex, tpsOpenIndex);
                                                                currentTextChunkOnly += textBeforeTps;
                                                                assistantRawAccumulated += textBeforeTps;
                                                                // assistantRawForTTS += textBeforeTps; // 삭제

                                                                const tpsCloseIndex = buffer.indexOf("</tps>", tpsOpenIndex);
                                                                if (tpsCloseIndex === -1) { // <tps> opened but not closed, wait for more data
                                                                        // Keep the unprocessed part (from <tps> onwards) in buffer
                                                                        assistantRawAccumulated += buffer.substring(tpsOpenIndex); // Store potentially incomplete tag
                                                                        buffer = buffer.substring(tpsOpenIndex);
                                                                        break;
                                                                }
                                                                tpsText = buffer.substring(tpsOpenIndex + 5, tpsCloseIndex);
                                                                assistantRawAccumulated += `<tps>${tpsText}</tps>`; // Keep tps for raw, will be stripped for display
                                                                tpsFoundInChunk = true;
                                                                lastProcessedIndex = tpsCloseIndex + 6; // Move past </tps>
                                                        }


                                                        if (currentTextChunkOnly.trim() && !firstChunkReceived) { // First non-empty text chunk
                                                                firstChunkReceived = true;
                                                                assistantBubble.innerHTML = ''; // Clear "⏳ 생각 중..."
                                                                assistantBubble.appendChild(copyBtn); // Add copy button
                                                                copyBtn.style.display = 'inline-block'; // Show copy button
                                                        }

                                                        if (firstChunkReceived) {
                                                                // Display logic: remove tps tags for rendering with marked.parse
                                                                const cleanTextForDisplay = assistantRawAccumulated.replace(/<tps>.*?<\/tps>/g, "");
                                                                const html = marked.parse(cleanTextForDisplay);

                                                                // Preserve copy button and tps display if they exist
                                                                // const existingSpeakerIcon = assistantBubble.querySelector('.tts-speaker-icon'); // 삭제
                                                                const existingCopyBtn = assistantBubble.querySelector('.copy-button');
                                                                const existingTpsDiv = assistantBubble.querySelector('.tps');

                                                                const contentDiv = document.createElement('div');
                                                                contentDiv.innerHTML = html; // Render new HTML content

                                                                assistantBubble.innerHTML = ''; // Clear previous content
                                                                while (contentDiv.firstChild) { // Append new parsed content
                                                                        assistantBubble.appendChild(contentDiv.firstChild);
                                                                }
                                                                // if(existingSpeakerIcon) assistantBubble.appendChild(existingSpeakerIcon); // 삭제
                                                                if (existingCopyBtn) assistantBubble.appendChild(existingCopyBtn); else if (copyBtn.style.display !== 'none') assistantBubble.appendChild(copyBtn);
                                                                if (existingTpsDiv) assistantBubble.appendChild(existingTpsDiv);


                                                                if (tpsFoundInChunk && tpsText) {
                                                                        let tpsSpan = assistantBubble.querySelector(".tps");
                                                                        if (!tpsSpan) {
                                                                                tpsSpan = document.createElement("div");
                                                                                tpsSpan.className = "tps";
                                                                                assistantBubble.appendChild(tpsSpan); // Append after content, before buttons
                                                                        }
                                                                        tpsSpan.innerText = `⚡ ${tpsText} tokens/sec`;
                                                                }
                                                        }
                                                        // Store raw text without tps for copy button functionality
                                                        assistantBubble.dataset.rawFullText = assistantRawAccumulated.replace(/<tps>.*?<\/tps>/g, "");
                                                        chatBox.scrollTop = chatBox.scrollHeight;

                                                        if (done) {
                                                                // TTS 호출 로직 삭제
                                                                // const serverPrefixPattern = `🧑‍💻 ${finalPrompt}\n🤖 `;
                                                                // let textForSpeechSynthesis = assistantRawForTTS; // 삭제
                                                                // if (assistantRawForTTS.startsWith(serverPrefixPattern)) { ... } // 삭제

                                                                if (!firstChunkReceived && assistantBubble.innerHTML.includes("⏳")) {
                                                                        const actualContentForDisplay = assistantRawAccumulated.replace(/<tps>.*?<\/tps>/g, "").replace(`🧑‍💻 ${finalPrompt}\n🤖 `, "").trim();
                                                                        if (actualContentForDisplay === "") {
                                                                                assistantBubble.innerHTML = "<span style='color:grey;'>응답이 없습니다.</span>";
                                                                                copyBtn.style.display = 'none';
                                                                        } else {
                                                                                // Ensure copy button is visible if content exists and was not shown before
                                                                                if (copyBtn.style.display === 'none' && assistantBubble.querySelector('.copy-button')) {
                                                                                        assistantBubble.querySelector('.copy-button').style.display = 'inline-block';
                                                                                }
                                                                        }
                                                                }

                                                                // playTTSSound 호출 삭제
                                                                // if (textForSpeechSynthesis.trim() !== "") { ... }
                                                                // else { ... }
                                                                return;
                                                        }
                                                        if (!abortController.signal.aborted) read();
                                                }).catch(err => {
                                                        if (err.name === 'AbortError' || (abortController && abortController.signal.aborted)) {
                                                                console.log('Fetch read aborted.');
                                                                if (!firstChunkReceived && assistantBubble.innerHTML.includes("⏳")) {
                                                                        assistantBubble.innerHTML = "<span style='color:orange;'>요청이 중단되었습니다.</span>";
                                                                        copyBtn.style.display = 'none';
                                                                }
                                                        } else {
                                                                console.error("스트림 읽기 오류:", err);
                                                                assistantBubble.innerHTML = `<br><span style='color:red;'>응답 스트리밍 중 오류: ${err.message}</span>`;
                                                                copyBtn.style.display = 'none';
                                                        }
                                                });
                                        }
                                        read();
                                })
                                .catch(err => {
                                        if (err.name === 'AbortError' || (abortController && abortController.signal.aborted)) {
                                                console.log('Fetch request aborted.');
                                                if (assistantBubble.innerHTML.includes("⏳")) { // Only update if still in "thinking" state
                                                        assistantBubble.innerHTML = "<span style='color:orange;'>요청이 중단되었습니다.</span>";
                                                        copyBtn.style.display = 'none';
                                                }
                                        } else {
                                                console.error("Fetch 오류:", err);
                                                assistantBubble.innerHTML = `<span style='color:red;'>서버 통신 오류: ${err.message}</span>`;
                                                copyBtn.style.display = 'none';
                                        }
                                        chatBox.scrollTop = chatBox.scrollHeight;
                                });
                        chatBox.scrollTop = chatBox.scrollHeight;
                }
        </script>
</body>
