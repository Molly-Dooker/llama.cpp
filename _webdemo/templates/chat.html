<!DOCTYPE html>
<html lang="ko">

<head>
        <meta charset="UTF-8">
        <title>BOS LLM DEMO</title>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <style>
                /* ... (기존 스타일은 동일) ... */
                body {
                        font-family: sans-serif;
                        background: #f0f2f5;
                        margin: 0;
                        padding: 0;
                        display: flex;
                        justify-content: center;
                        align-items: flex-start;
                        min-height: 100vh;
                }

                .container {
                        max-width: 800px;
                        width: 90%;
                        margin-top: 40px;
                        margin-bottom: 40px;
                        background: white;
                        padding: 20px;
                        border-radius: 8px;
                        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
                        display: flex;
                        flex-direction: column;
                }

                #chat {
                        display: flex;
                        flex-direction: column;
                        gap: 15px;
                        max-height: 500px;
                        overflow-y: auto;
                        padding-bottom: 10px;
                        margin-bottom: 15px;
                        flex-grow: 1;
                }

                .bubble {
                        padding: 12px 16px;
                        border-radius: 18px;
                        max-width: 100%;
                        white-space: pre-wrap;
                        line-height: 1.5;
                        position: relative;
                        overflow-wrap: break-word;
                }

                .user {
                        align-self: flex-end;
                        background: #10a37f;
                        color: white;
                        border-bottom-right-radius: 4px;
                }

                .assistant {
                        align-self: flex-start;
                        background: #e5e5ea;
                        color: black;
                        border-bottom-left-radius: 4px;
                        position: relative;
                }

                .assistant pre {
                        max-width: 100%;
                        overflow-x: auto;
                }

                .system-message { /* 채팅창 내 시스템 메시지 스타일 */
                        align-self: center;
                        background: #f8f9fa;
                        color: #495057;
                        border: 1px solid #dee2e6;
                        padding: 8px 12px;
                        border-radius: 10px;
                        font-size: 0.85em;
                        text-align: center;
                        max-width: 80%;
                        margin-top: 5px;
                        margin-bottom: 5px;
                }
                .system-message.error {
                    color: #dc3545;
                    border-color: #f5c6cb;
                    background-color: #f8d7da;
                }


                .tps {
                        font-size: 0.8em;
                        color: #666;
                        margin-top: 8px;
                }

                .copy-button {
                        position: absolute;
                        top: 8px;
                        right: 10px;
                        background: transparent;
                        border: none;
                        font-size: 0.9em;
                        color: #666;
                        cursor: pointer;
                        padding: 3px;
                        z-index: 1; /* Ensure copy button is clickable */
                }

                .copy-button:hover {
                        color: #333;
                }
                .tts-speaker-icon {
                    font-size: 0.9em;
                    margin-left: 8px; /* Default margin */
                    cursor: pointer;
                    display: inline-block;
                    padding: 3px; /* Add some padding for easier clicking */
                    z-index: 2; /* Ensure speaker is above other elements if overlapping */
                }
                .tts-speaker-icon:hover {
                    opacity: 0.7;
                }

                /* Adjust margin if it's the first interactive element */
                .assistant > .tts-speaker-icon:first-child {
                    margin-left: 0;
                }
                 /* Adjust margin if it's next to a copy button (which is absolute) */
                .copy-button + .tts-speaker-icon {
                    margin-left: 0; /* Remove margin if it follows an absolutely positioned copy button */
                }


                pre {
                        background: #333;
                        color: #eee;
                        padding: 10px;
                        border-radius: 6px;
                        overflow-x: auto;
                        max-width: 100%;
                        box-sizing: border-box;
                }

                code {
                        background: #eee;
                        padding: 2px 4px;
                        border-radius: 4px;
                        font-family: monospace;
                }

                pre code {
                        background: none;
                        padding: 0;
                }

                .controls-area {
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                }

                textarea#prompt {
                        width: 100%;
                        box-sizing: border-box;
                        height: 80px;
                        font-size: 1em;
                        padding: 10px;
                        border: 1px solid #ccc;
                        border-radius: 6px;
                        resize: vertical;
                }

                .action-buttons-row {
                        display: flex;
                        gap: 10px;
                        justify-content: center;
                        align-items: stretch;
                }

                .action-buttons-row button {
                        padding: 10px 15px;
                        font-size: 0.9em;
                        color: white;
                        border: none;
                        border-radius: 6px;
                        cursor: pointer;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 5px;
                        flex-grow: 1;
                        flex-basis: 0;
                }

                button.send {
                        background: #28a745;
                }

                button#recordBtn {
                        background-color: #17a2b8;
                }

                button#recordBtn.recording {
                        background-color: #dc3545;
                }

                button.reset {
                        background: #dc3545;
                }

                #recordStatus { /* 하단 로그 표시 영역 */
                        display: none;
                        text-align: center;
                        font-size: 0.9em;
                        color: #555;
                        margin-top: 5px;
                        padding: 5px 8px;
                        background-color: #f0f0f0;
                        border-radius: 4px;
                        border: 1px solid #ddd;
                }
                #recordStatus.error {
                        color: #D8000C;
                        background-color: #FFD2D2;
                        border-color: #D8000C;
                }
                #recordStatus.success {
                        color: #270;
                        background-color: #DFF2BF;
                        border-color: #4F8A10;
                }
                #recordStatus.info {
                        color: #00529B;
                        background-color: #BDE5F8;
                        border-color: #00529B;
                }
        </style>
</head>

<body>
        <div class="container">
                <h2>💬 BOS LLM DEMO</h2>
                <div id="chat"></div>

                <div class="controls-area">
                        <textarea id="prompt" placeholder="메시지를 입력하세요... (Enter: 전송, Shift+Enter: 줄바꿈)"></textarea>
                        <div class="action-buttons-row">
                                <button class="send" id="sendBtn">보내기</button>
                                <button id="recordBtn">🎤 녹음 시작</button>
                                <button class="reset" id="resetBtn">초기화</button>
                        </div>
                        <span id="recordStatus"></span>
                </div>
        </div>

        <script>
                const promptBox = document.getElementById("prompt");
                const chatBox = document.getElementById("chat");
                const sendBtn = document.getElementById("sendBtn");
                const resetBtn = document.getElementById("resetBtn");
                let abortController = null;

                const recordBtn = document.getElementById('recordBtn');
                const recordStatus = document.getElementById('recordStatus');
                let mediaRecorder;
                let audioChunks = [];
                let isRecording = false;
                let sttStatusIntervalId = null;
                let ttsStatusIntervalId = null;
                let recordStatusTimeoutId = null;
                let activeTTSPlayers = []; // Stores { audio, url, bubble, speakerIcon, isPlaying, urlRevoked }

                function updateRecordStatus(message, type = 'info', persist = false) {
                    if (recordStatusTimeoutId) {
                        clearTimeout(recordStatusTimeoutId);
                    }
                    recordStatus.textContent = message;
                    recordStatus.className = type;
                    recordStatus.style.display = 'block';

                    if (!persist) {
                        recordStatusTimeoutId = setTimeout(() => {
                            recordStatus.style.display = 'none';
                            recordStatus.textContent = '';
                            recordStatus.className = '';
                        }, 5000);
                    }
                }


                promptBox.addEventListener("keydown", function (e) {
                        if (e.key === "Enter" && !e.shiftKey) {
                                e.preventDefault();
                                sendChat();
                        }
                });

                sendBtn.addEventListener("click", () => {
                        sendChat();
                });

                resetBtn.addEventListener("click", () => {
                        if (abortController) abortController.abort();
                        chatBox.innerHTML = "";
                        promptBox.value = "";
                        if (isRecording) {
                                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                                        mediaRecorder.stop();
                                }
                                isRecording = false;
                                recordBtn.innerHTML = '🎤 녹음 시작';
                                recordBtn.classList.remove('recording');
                                console.log('녹음 취소됨.');
                                audioChunks = [];
                        }

                        activeTTSPlayers.forEach(playerData => {
                            if (playerData.audio) {
                                playerData.audio.pause();
                                playerData.audio.currentTime = 0;
                                if (playerData.url && !playerData.urlRevoked) {
                                    URL.revokeObjectURL(playerData.url);
                                    playerData.urlRevoked = true;
                                }
                            }
                            if (playerData.speakerIcon) {
                                 playerData.speakerIcon.innerHTML = "🔊";
                                 playerData.speakerIcon.title = "소리 재생";
                            }
                            playerData.isPlaying = false;
                        });
                        activeTTSPlayers = [];
                        console.log("모든 TTS 오디오 정지, URL 해제 및 아이콘 초기화됨.");


                        if (sttStatusIntervalId) {
                                clearInterval(sttStatusIntervalId);
                                sttStatusIntervalId = null;
                        }
                        if (ttsStatusIntervalId) {
                                clearInterval(ttsStatusIntervalId);
                                ttsStatusIntervalId = null;
                        }
                        if (recordStatusTimeoutId) {
                            clearTimeout(recordStatusTimeoutId);
                        }
                        recordStatus.textContent = '';
                        recordStatus.style.display = 'none';
                        recordStatus.className = '';
                });

                function appendSystemMessage(message, isError = false) {
                        const systemBubble = document.createElement("div");
                        systemBubble.className = "bubble system-message";
                        if (isError) {
                            systemBubble.classList.add("error");
                        }
                        systemBubble.textContent = message;
                        chatBox.appendChild(systemBubble);
                        chatBox.scrollTop = chatBox.scrollHeight;
                        setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 100);
                }
                
                function updateSpeakerState(pData, playing) {
                    if (!pData) return;
                    pData.isPlaying = playing;
                    if (pData.speakerIcon) {
                        pData.speakerIcon.innerHTML = playing ? "⏹️" : "🔊";
                        pData.speakerIcon.title = playing ? "재생 중지" : "소리 재생";
                    }
                }

                function playTTSSound(text, bubbleElement) {
                    console.log("Requesting TTS for:", text);
                    if (!text || text.trim() === "") {
                        console.log("TTS 요청 텍스트가 비어있습니다.");
                        return;
                    }

                    if (ttsStatusIntervalId) {
                        clearInterval(ttsStatusIntervalId);
                        ttsStatusIntervalId = null;
                    }

                    let startTime = Date.now();
                    updateRecordStatus("음성 변환(TTS) 진행 중... (0초)", 'info', true);
                    console.log('음성 변환(TTS) 시작...');

                    ttsStatusIntervalId = setInterval(() => {
                        const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                        if (recordStatus.style.display === 'block' && recordStatus.textContent.startsWith("음성 변환(TTS) 진행 중")) {
                             recordStatus.textContent = `음성 변환(TTS) 진행 중... (${elapsedTime}초)`;
                        } else {
                            clearInterval(ttsStatusIntervalId);
                            ttsStatusIntervalId = null;
                        }
                    }, 1000);
                    
                    fetch("/synthesize_speech", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ text: text, voice: "nova" })
                    })
                    .then(response => {
                        if (ttsStatusIntervalId) {
                            clearInterval(ttsStatusIntervalId);
                            ttsStatusIntervalId = null;
                        }
                        if (!response.ok) {
                            return response.json().then(errData => {
                                throw new Error(`${errData.error || response.statusText}`);
                            }).catch(() => {
                                throw new Error(`${response.statusText}`);
                            });
                        }
                        return response.blob();
                    })
                    .then(audioBlob => {
                        updateRecordStatus("음성 데이터 수신 완료. 재생 준비...", 'info');
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const audio = new Audio(audioUrl); 
                        
                        const playerData = {
                            audio: audio,
                            url: audioUrl,
                            bubble: bubbleElement,
                            speakerIcon: null, 
                            isPlaying: false,
                            urlRevoked: false
                        };

                        let speakerIcon = bubbleElement.querySelector('.tts-speaker-icon');
                        if (!speakerIcon) {
                            speakerIcon = document.createElement("span");
                            speakerIcon.className = 'tts-speaker-icon';
                            
                            const tpsDiv = bubbleElement.querySelector('.tps');
                            const copyBtnInBubble = bubbleElement.querySelector('.copy-button');

                            if (tpsDiv) {
                                tpsDiv.parentNode.insertBefore(speakerIcon, tpsDiv);
                            } else if (copyBtnInBubble) {
                                copyBtnInBubble.parentNode.insertBefore(speakerIcon, copyBtnInBubble);
                            } else {
                                bubbleElement.appendChild(speakerIcon);
                            }
                        }
                        playerData.speakerIcon = speakerIcon;
                        updateSpeakerState(playerData, false); 

                        speakerIcon.onclick = (e) => {
                            e.stopPropagation();
                            const pData = activeTTSPlayers.find(p => p.audio === audio);

                            if (!pData) {
                                console.log("Audio player data not found. This might happen after a full chat reset. Icon reset to default.");
                                e.target.innerHTML = "🔊"; 
                                e.target.title = "소리 재생";
                                return;
                            }

                            if (pData.isPlaying) { 
                                pData.audio.pause();
                                pData.audio.currentTime = 0;
                                updateRecordStatus("재생 중지됨.", 'info');
                                updateSpeakerState(pData, false); 
                            } else { 
                                pData.audio.currentTime = 0; 
                                pData.audio.play().then(() => {
                                    updateSpeakerState(pData, true); 
                                    updateRecordStatus("음성 수동 재생 중...", 'info', true);
                                }).catch(e_play => {
                                    console.error("TTS 수동 재생 오류:", e_play);
                                    updateRecordStatus("음성 수동 재생 실패!", 'error');
                                    updateSpeakerState(pData, false); 
                                });
                            }
                        };
                        
                        activeTTSPlayers.push(playerData);

                        audio.play().then(() => {
                            console.log("TTS 오디오 자동 재생 시작됨.");
                            updateSpeakerState(playerData, true); 
                            updateRecordStatus("음성 재생 중...", 'info', true);
                        }).catch(e_play => {
                            console.warn("TTS 오디오 자동 재생 실패:", e_play);
                            updateRecordStatus("음성 자동 재생 실패. 🔊 아이콘 클릭!", 'info', true);
                            appendSystemMessage("음성 자동 재생에 실패했습니다. 🔊 아이콘을 클릭하여 재생하세요.");
                            updateSpeakerState(playerData, false); 
                        });

                        audio.onended = () => {
                            console.log("TTS 오디오 재생 완료.");
                            updateRecordStatus("음성 재생 완료.", 'success');
                            const pData = activeTTSPlayers.find(p => p.audio === audio);
                            if (pData) {
                                updateSpeakerState(pData, false); 
                            }
                        };
                        audio.onerror = (e_audio_err) => {
                            console.error("Audio element error:", e_audio_err);
                            updateRecordStatus("음성 재생 중 오류 발생.", 'error');
                            const pData = activeTTSPlayers.find(p => p.audio === audio);
                            if (pData) {
                                updateSpeakerState(pData, false); 
                            }
                        };
                    })
                    .catch(error => {
                        if (ttsStatusIntervalId) {
                            clearInterval(ttsStatusIntervalId);
                            ttsStatusIntervalId = null;
                        }
                        console.error("TTS 요청 또는 처리 오류:", error);
                        updateRecordStatus(`음성 변환(TTS) 실패: ${error.message}`, 'error');
                        let speakerIcon = bubbleElement.querySelector('.tts-speaker-icon');
                        if (speakerIcon) speakerIcon.innerHTML = "🔇";
                    });
                }
                
                recordBtn.addEventListener('click', async () => {
                        if (!isRecording) {
                                // --- 녹음 시작 시, 모든 활성 TTS 오디오 중지 ---
                                let audioWasPlaying = false;
                                activeTTSPlayers.forEach(playerData => {
                                    if (playerData.audio) {
                                        if (playerData.isPlaying) {
                                            playerData.audio.pause();
                                            playerData.audio.currentTime = 0;
                                            playerData.isPlaying = false; // 상태 업데이트
                                            audioWasPlaying = true;
                                            console.log("TTS 오디오 중지됨 (녹음 시작으로 인해)");
                                        }
                                        // 아이콘 상태도 초기화 (항상 '재생 가능'으로)
                                        if (playerData.speakerIcon) {
                                            playerData.speakerIcon.innerHTML = "🔊";
                                            playerData.speakerIcon.title = "소리 재생";
                                        }
                                    }
                                });
                                if (audioWasPlaying) {
                                   updateRecordStatus('모든 재생 중인 오디오가 중지되었습니다.', 'info');
                                }
                                // --- 오디오 중지 로직 끝 ---

                                try {
                                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                                        const options = {};
                                        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                                                options.mimeType = 'audio/webm;codecs=opus';
                                        } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                                                options.mimeType = 'audio/webm';
                                        } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
                                                options.mimeType = 'audio/ogg;codecs=opus';
                                        } else {
                                                console.warn("선호하는 webm/opus MIME 타입이 지원되지 않습니다. 브라우저 기본값을 사용합니다.");
                                        }

                                        mediaRecorder = new MediaRecorder(stream, options);
                                        audioChunks = [];

                                        mediaRecorder.ondataavailable = event => {
                                                audioChunks.push(event.data);
                                        };

                                        mediaRecorder.onstop = async () => {
                                                const currentStreamTracks = mediaRecorder.stream.getTracks();
                                                if (sttStatusIntervalId) {
                                                        clearInterval(sttStatusIntervalId);
                                                        sttStatusIntervalId = null;
                                                }

                                                if (audioChunks.length === 0) {
                                                    console.log('No audio data recorded or recording was reset.');
                                                    updateRecordStatus('녹음된 데이터가 없거나 취소되었습니다.', 'error');
                                                    currentStreamTracks.forEach(track => track.stop());
                                                    if (isRecording) { // Check if it was recording (e.g. stopped by reset)
                                                        isRecording = false;
                                                        recordBtn.innerHTML = '🎤 녹음 시작';
                                                        recordBtn.classList.remove('recording');
                                                    }
                                                    return;
                                                }

                                                const blobMimeType = mediaRecorder.mimeType || (options.mimeType || 'audio/webm');
                                                const audioBlob = new Blob(audioChunks, { type: blobMimeType });
                                                audioChunks = []; 
                                                const formData = new FormData();
                                                let recordingFilename = 'recording';
                                                if (blobMimeType.includes('webm')) recordingFilename += '.webm';
                                                else if (blobMimeType.includes('ogg')) recordingFilename += '.ogg';
                                                else recordingFilename += '.bin'; 

                                                formData.append('audio_data', audioBlob, recordingFilename);

                                                let startTime = Date.now();
                                                updateRecordStatus('오디오 업로드 및 STT 변환 중... (0초)', 'info', true);
                                                console.log('오디오 업로드 및 STT 변환 시작...');

                                                sttStatusIntervalId = setInterval(() => {
                                                        const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                                                        if (recordStatus.style.display === 'block' && recordStatus.textContent.startsWith("오디오 업로드 및 STT 변환 중")) {
                                                            recordStatus.textContent = `오디오 업로드 및 STT 변환 중... (${elapsedTime}초)`;
                                                        } else {
                                                            clearInterval(sttStatusIntervalId);
                                                            sttStatusIntervalId = null;
                                                        }
                                                }, 1000);

                                                try {
                                                        const response = await fetch('/upload_audio', {
                                                                method: 'POST',
                                                                body: formData
                                                        });
                                                        clearInterval(sttStatusIntervalId);
                                                        sttStatusIntervalId = null;
                                                        const result = await response.json();

                                                        if (response.ok && result.file_saved) {
                                                                console.log(`서버 메시지 (upload_audio): ${result.message}`);
                                                                if (result.transcribed_text && result.transcribed_text.trim() !== "") {
                                                                        console.log(`STT 변환 결과: ${result.transcribed_text}`);
                                                                        updateRecordStatus(`음성인식 결과: ${result.transcribed_text}`, 'success');
                                                                        sendChat(result.transcribed_text, true); 
                                                                } else {
                                                                        const customMessage = "음성인식에 실패했거나 음성이 감지되지 않았습니다.";
                                                                        console.warn(customMessage + ` (서버 상세: ${result.message || 'STT 결과 없음'})`);
                                                                        updateRecordStatus(customMessage, 'error');
                                                                }
                                                        } else {
                                                                const errorMsg = `오디오 업로드/변환 오류: ${result.error || response.statusText || '알 수 없는 오류'}`;
                                                                console.error(errorMsg);
                                                                updateRecordStatus(errorMsg, 'error');
                                                        }
                                                } catch (error) {
                                                        if (sttStatusIntervalId) {
                                                                clearInterval(sttStatusIntervalId);
                                                                sttStatusIntervalId = null;
                                                        }
                                                        console.error('오디오 업로드 처리 중 알 수 없는 오류 발생:', error);
                                                        const errorMsg = '오디오 업로드 처리 중 알 수 없는 오류가 발생했습니다.';
                                                        updateRecordStatus(errorMsg, 'error');
                                                } finally {
                                                        if (sttStatusIntervalId) {
                                                                clearInterval(sttStatusIntervalId);
                                                                sttStatusIntervalId = null;
                                                        }
                                                        currentStreamTracks.forEach(track => track.stop()); 
                                                }
                                        };

                                        mediaRecorder.start();
                                        isRecording = true;
                                        recordBtn.innerHTML = '■ 녹음 중지';
                                        recordBtn.classList.add('recording');
                                        updateRecordStatus('녹음 시작됨...', 'info');
                                        console.log('녹음 시작됨...');

                                } catch (err) {
                                        console.error('녹음 시작 오류:', err);
                                        let userFriendlyMessage = '마이크 접근 중 오류가 발생했습니다.';
                                        if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
                                                userFriendlyMessage = '마이크 권한이 거부되었습니다. 브라우저 설정을 확인해주세요.';
                                        } else if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
                                                userFriendlyMessage = '사용 가능한 마이크가 없습니다.';
                                        } else if (err.name === "NotReadableError" || err.name === "TrackStartError") {
                                                userFriendlyMessage = '마이크를 사용할 수 없습니다. 다른 앱에서 사용 중인지 확인해주세요.';
                                        }
                                        updateRecordStatus(userFriendlyMessage, 'error');
                                }
                        } else { // Stop recording
                                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                                        mediaRecorder.stop(); 
                                }
                                isRecording = false;
                                recordBtn.innerHTML = '🎤 녹음 시작';
                                recordBtn.classList.remove('recording');
                                updateRecordStatus('녹음 중지됨.', 'info');
                                console.log('녹음 중지 요청됨.');
                        }
                });

                function sendChat(inputText, isFromSTT = false) {
                        const promptFromBox = promptBox.value.trim();
                        const finalPrompt = isFromSTT ? inputText : promptFromBox;

                        if (!finalPrompt) return;

                        if (abortController) {
                                abortController.abort();
                                console.log("Previous fetch aborted");
                        }
                        abortController = new AbortController();

                        if (!isFromSTT) {
                                promptBox.value = "";
                        }

                        const userBubble = document.createElement("div");
                        userBubble.className = "bubble user";
                        userBubble.textContent = isFromSTT ? "🎤: " + finalPrompt : finalPrompt;
                        chatBox.appendChild(userBubble);
                        chatBox.scrollTop = chatBox.scrollHeight;


                        const assistantBubble = document.createElement("div");
                        assistantBubble.className = "bubble assistant";
                        assistantBubble.innerHTML = "⏳ 생각 중...";
                        chatBox.appendChild(assistantBubble);
                        chatBox.scrollTop = chatBox.scrollHeight;


                        const copyBtn = document.createElement("button");
                        copyBtn.className = "copy-button";
                        copyBtn.innerText = "📋";
                        copyBtn.title = "복사";
                        copyBtn.style.display = 'none'; 

                        copyBtn.onclick = (e) => {
                                e.stopPropagation();
                                const tempDiv = document.createElement("div");
                                let textToCopy = assistantBubble.dataset.rawFullText || "";
                                tempDiv.innerHTML = marked.parse(textToCopy); 
                                const pureText = tempDiv.textContent || tempDiv.innerText || "";

                                navigator.clipboard.writeText(pureText).then(() => {
                                        copyBtn.innerText = "✅";
                                        setTimeout(() => copyBtn.innerText = "📋", 1500);
                                }).catch(err => {
                                        console.error('클립보드 복사 실패:', err);
                                        copyBtn.innerText = "❌";
                                        setTimeout(() => copyBtn.innerText = "📋", 1500);
                                });
                        };

                        let assistantRawAccumulated = ""; 
                        let assistantRawForTTS = "";      
                        let tpsText = "";
                        let firstChunkReceived = false;

                        fetch("/chat", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ prompt: finalPrompt }),
                                signal: abortController.signal
                        })
                                .then(res => {
                                        if (!res.ok) {
                                                return res.text().then(text => { 
                                                        throw new Error(`서버 오류: ${res.status} ${res.statusText} - ${text}`);
                                                });
                                        }
                                        const reader = res.body.getReader();
                                        const decoder = new TextDecoder("utf-8");
                                        let buffer = "";

                                        function read() {
                                                reader.read().then(({ done, value }) => {
                                                        if (abortController.signal.aborted) {
                                                                console.log("Fetch aborted during read");
                                                                if (!firstChunkReceived && assistantBubble.innerHTML.includes("⏳")) {
                                                                        assistantBubble.innerHTML = "<span style='color:orange;'>요청이 중단되었습니다.</span>";
                                                                        copyBtn.style.display = 'none';
                                                                }
                                                                return;
                                                        }

                                                        const chunk = value ? decoder.decode(value, { stream: true }) : "";
                                                        buffer += chunk;

                                                        let currentTextChunkOnly = ""; 
                                                        let tpsFoundInChunk = false;

                                                        let lastProcessedIndex = 0;
                                                        while (true) {
                                                            const tpsOpenIndex = buffer.indexOf("<tps>", lastProcessedIndex);
                                                            if (tpsOpenIndex === -1) { 
                                                                const textPart = buffer.substring(lastProcessedIndex);
                                                                currentTextChunkOnly += textPart;
                                                                assistantRawAccumulated += textPart; 
                                                                assistantRawForTTS += textPart;    
                                                                buffer = ""; 
                                                                break;
                                                            }

                                                            const textBeforeTps = buffer.substring(lastProcessedIndex, tpsOpenIndex);
                                                            currentTextChunkOnly += textBeforeTps;
                                                            assistantRawAccumulated += textBeforeTps;
                                                            assistantRawForTTS += textBeforeTps;
                                                            
                                                            const tpsCloseIndex = buffer.indexOf("</tps>", tpsOpenIndex);
                                                            if (tpsCloseIndex === -1) { 
                                                                assistantRawAccumulated += buffer.substring(tpsOpenIndex); 
                                                                buffer = buffer.substring(tpsOpenIndex); 
                                                                break;
                                                            }
                                                            tpsText = buffer.substring(tpsOpenIndex + 5, tpsCloseIndex);
                                                            assistantRawAccumulated += `<tps>${tpsText}</tps>`; 
                                                            tpsFoundInChunk = true;
                                                            lastProcessedIndex = tpsCloseIndex + 6; 
                                                        }


                                                        if (currentTextChunkOnly.trim() && !firstChunkReceived) { 
                                                                firstChunkReceived = true;
                                                                assistantBubble.innerHTML = ''; 
                                                                assistantBubble.appendChild(copyBtn);
                                                                copyBtn.style.display = 'inline-block';
                                                        }

                                                        if (firstChunkReceived) {
                                                                const cleanTextForDisplay = assistantRawAccumulated.replace(/<tps>.*?<\/tps>/g, "");
                                                                const html = marked.parse(cleanTextForDisplay);
                                                                
                                                                const existingSpeakerIcon = assistantBubble.querySelector('.tts-speaker-icon');
                                                                const existingCopyBtn = assistantBubble.querySelector('.copy-button');
                                                                const existingTpsDiv = assistantBubble.querySelector('.tps');
                                                                
                                                                const contentDiv = document.createElement('div');
                                                                contentDiv.innerHTML = html; 
                                                                
                                                                assistantBubble.innerHTML = ''; 
                                                                while(contentDiv.firstChild) { 
                                                                    assistantBubble.appendChild(contentDiv.firstChild);
                                                                }
                                                                if(existingSpeakerIcon) assistantBubble.appendChild(existingSpeakerIcon);
                                                                if(existingCopyBtn) assistantBubble.appendChild(existingCopyBtn); else if (copyBtn.style.display !== 'none') assistantBubble.appendChild(copyBtn);
                                                                if(existingTpsDiv) assistantBubble.appendChild(existingTpsDiv);


                                                                if (tpsFoundInChunk && tpsText) {
                                                                    let tpsSpan = assistantBubble.querySelector(".tps");
                                                                    if (!tpsSpan) {
                                                                            tpsSpan = document.createElement("div");
                                                                            tpsSpan.className = "tps";
                                                                            assistantBubble.appendChild(tpsSpan); 
                                                                    }
                                                                    tpsSpan.innerText = `⚡ ${tpsText} tokens/sec`;
                                                                }
                                                        }
                                                        assistantBubble.dataset.rawFullText = assistantRawAccumulated.replace(/<tps>.*?<\/tps>/g, ""); 
                                                        chatBox.scrollTop = chatBox.scrollHeight;

                                                        if (done) {
                                                            const serverPrefixPattern = `🧑‍💻 ${finalPrompt}\n🤖 `;
                                                            let textForSpeechSynthesis = assistantRawForTTS;

                                                            if (assistantRawForTTS.startsWith(serverPrefixPattern)) {
                                                                textForSpeechSynthesis = assistantRawForTTS.substring(serverPrefixPattern.length);
                                                                console.log("Server prefix stripped for TTS.");
                                                            } else {
                                                                if (assistantRawForTTS.trim() !== "") {
                                                                    console.warn("Server prefix was not found as expected. TTS will use the full received assistant response.");
                                                                }
                                                            }

                                                            if (!firstChunkReceived && assistantBubble.innerHTML.includes("⏳")) {
                                                                const actualContentForDisplay = textForSpeechSynthesis.trim();
                                                                if (actualContentForDisplay === "") {
                                                                    assistantBubble.innerHTML = "<span style='color:grey;'>응답이 없습니다.</span>";
                                                                    copyBtn.style.display = 'none';
                                                                } else {
                                                                    if(copyBtn.style.display === 'none' && assistantBubble.querySelector('.copy-button')) {
                                                                        assistantBubble.querySelector('.copy-button').style.display = 'inline-block';
                                                                    }
                                                                }
                                                            }
                                                            
                                                            if (textForSpeechSynthesis.trim() !== "") {
                                                                playTTSSound(textForSpeechSynthesis.trim(), assistantBubble);
                                                            } else {
                                                                console.log("TTS content is empty after processing. No sound will be played.");
                                                                if (assistantBubble.innerHTML.includes("⏳")) { 
                                                                     assistantBubble.innerHTML = "<span style='color:grey;'>응답이 없습니다.</span>";
                                                                     copyBtn.style.display = 'none';
                                                                }
                                                            }
                                                            return;
                                                        }
                                                        if (!abortController.signal.aborted) read();
                                                }).catch(err => {
                                                        if (err.name === 'AbortError' || (abortController && abortController.signal.aborted)) {
                                                                console.log('Fetch read aborted.');
                                                                if (!firstChunkReceived && assistantBubble.innerHTML.includes("⏳")) {
                                                                        assistantBubble.innerHTML = "<span style='color:orange;'>요청이 중단되었습니다.</span>";
                                                                        copyBtn.style.display = 'none';
                                                                }
                                                        } else {
                                                                console.error("스트림 읽기 오류:", err);
                                                                assistantBubble.innerHTML = `<br><span style='color:red;'>응답 스트리밍 중 오류: ${err.message}</span>`;
                                                                copyBtn.style.display = 'none';
                                                        }
                                                });
                                        }
                                        read();
                                })
                                .catch(err => {
                                        if (err.name === 'AbortError' || (abortController && abortController.signal.aborted)) {
                                                console.log('Fetch request aborted.');
                                                if (assistantBubble.innerHTML.includes("⏳")) { 
                                                        assistantBubble.innerHTML = "<span style='color:orange;'>요청이 중단되었습니다.</span>";
                                                        copyBtn.style.display = 'none';
                                                }
                                        } else {
                                                console.error("Fetch 오류:", err);
                                                assistantBubble.innerHTML = `<span style='color:red;'>서버 통신 오류: ${err.message}</span>`;
                                                copyBtn.style.display = 'none';
                                        }
                                        chatBox.scrollTop = chatBox.scrollHeight;
                                });
                        chatBox.scrollTop = chatBox.scrollHeight;
                }
        </script>
</body>

</html>
